services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - /run/base44/app.env
    restart: unless-stopped

volumes:
  node_modules:
